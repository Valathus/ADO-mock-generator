########################################################
# Azure DevOps Server Configuration
########################################################
ado.apiVersion=6.0
ado.connectTimeoutMs=5000
ado.readTimeoutMs=15000
ado.retry.maxAttempts=3
ado.retry.backoffMs=500

########################################################
# Seeding Configuration
########################################################

seed.windowDays=7
seed.workItemsPerDay=2
seed.buildsPerDay=5

########################################################
# Simulation Feature Flags
########################################################

mock.seed.workItems.enabled=true
mock.seed.builds.enabled=true
mock.seed.repo.enabled=true
mock.seed.iterations.enabled=true

mock.mutation.enabled=false
mock.webhooks.enabled=false

mock.workItem.state.done=Done
mock.workItem.state.active=Active
mock.random.seed=12345

########################################################
# Mutation Configuration
########################################################

mutations.perHour=10
mutations.mix.workItemUpdatePct=50
mutations.mix.repoWorkflowPct=30
mutations.mix.pipelinePct=20
mutations.maxConcurrent=1

########################################################
# Pipeline Configuration
########################################################

mock.pipeline.cancel.enabled=true
mock.pipeline.updateWorkItemOnSuccess=true
mock.pipeline.updateWorkItemOnFailure=false
mock.buildQueueName=Default

########################################################
# TFVC (enable if you have a TFVC repo alongside Git)
########################################################

mock.tfvc.enabled=false
mock.tfvc.rootPath=$/YourProject

########################################################
# Classic Release Pipeline (enable + set your definition ID)
########################################################

mock.release.enabled=false
mock.release.definitionId=0

########################################################
# Test Run Events
########################################################

mock.testrun.enabled=false

########################################################
# State File Storage
########################################################

storage.stateFile=./mock-state.json

########################################################
# Quartz Configuration
########################################################

spring.quartz.job-store-type=memory
spring.quartz.scheduler.instance-name=ado-mock-scheduler
spring.quartz.scheduler.instance-id=AUTO
spring.quartz.auto-startup=true
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000


########################################################
# Logging
########################################################

logging.level.root=INFO
logging.level.org.quartz=DEBUG
logging.level.com.example.adomock=INFO
logging.level.com.example.adomock.webhook=INFO
logging.file.name=./ado-mock.log
